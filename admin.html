<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Админ панель</title>
<style>
body { font-family: Arial; padding:20px; }
table { border-collapse: collapse; width:100%; }
th, td { border:1px solid #ddd; padding:6px; font-size:13px; }
th { background:#2c3e50; color:white; }
</style>
</head>
<body>

<h2>Админ панель заявок</h2>
<table id="table"></table>

<iframe id="apiFrame" style="display:none;"></iframe>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyW6VEd4sEuWV-0Nfi1fdiGjc6Yvo-OLfaXLi0SBxZxWl_Qzqbxnwa4uCxR4D2z2PC8Pg/exec";

window.addEventListener("message", function(event) {

  if (!event.data || !event.data.success) {
    document.body.innerHTML += "<p>Ошибка загрузки данных</p>";
    return;
  }

  const data = event.data.data;
  const table = document.getElementById("table");

  let html = "<tr>";
  data[0].forEach(col => html += `<th>${col}</th>`);
  html += "<th>Изменить</th></tr>";

  for (let i = 1; i < data.length; i++) {

    html += "<tr>";
    data[i].forEach(cell => html += `<td>${cell}</td>`);

    html += `
    <td>
      <select onchange="updateStatus(${i+1}, this.value)">
        <option ${data[i][6]=="Новая"?"selected":""}>Новая</option>
        <option ${data[i][6]=="В работе"?"selected":""}>В работе</option>
        <option ${data[i][6]=="Одобрено"?"selected":""}>Одобрено</option>
        <option ${data[i][6]=="Отказ"?"selected":""}>Отказ</option>
      </select>
    </td>`;

    html += "</tr>";
  }

  table.innerHTML = html;

});

function loadData() {
  document.getElementById("apiFrame").src = API_URL + "?action=getRequests&iframe=1";
}

function updateStatus(row, status) {

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "updateStatus",
      row: row,
      status: status,
      user: "Admin"
    })
  })
  .then(() => alert("Статус обновлён"));
}

loadData();

</script>

</body>
</html>
