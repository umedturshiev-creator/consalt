<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwUUcRsGyZpHGqVOvKp3qiQ7p_D9sBgwFcuf7ksqX3gkwtUlnRIW1ArbXtnw4L4bIdPXQ/exec";

async function loadData() {
  try {

    const response = await fetch(API_URL + "?action=getRequests");
    const result = await response.json();

    if (!result.success) {
      document.body.innerHTML += "<p>Ошибка загрузки данных</p>";
      return;
    }

    const data = result.data;
    const table = document.getElementById("table");

    let html = "<tr>";

    data[0].forEach(col => {
      html += `<th>${col}</th>`;
    });

    html += "<th>Изменить</th></tr>";

    for (let i = 1; i < data.length; i++) {

      html += "<tr>";

      data[i].forEach(cell => {
        html += `<td>${cell}</td>`;
      });

      html += `
      <td>
        <select onchange="updateStatus(${i+1}, this.value)">
          <option ${data[i][6]=="Новая"?"selected":""}>Новая</option>
          <option ${data[i][6]=="В работе"?"selected":""}>В работе</option>
          <option ${data[i][6]=="Одобрено"?"selected":""}>Одобрено</option>
          <option ${data[i][6]=="Отказ"?"selected":""}>Отказ</option>
        </select>
      </td>`;

      html += "</tr>";
    }

    table.innerHTML = html;

  } catch (err) {
    document.body.innerHTML += "<p>Ошибка подключения к API</p>";
  }
}

function updateStatus(row, status) {

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "updateStatus",
      row: row,
      status: status,
      user: "Admin"
    })
  })
  .then(res => res.json())
  .then(() => alert("Статус обновлён"));
}

loadData();

</script>
