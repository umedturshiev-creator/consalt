<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>UZA App</title>

<style>

/* ===== BODY ===== */
body {
  margin:0;
  font-family:Arial;
  color:#fff;
  overflow-x:hidden;

  background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent),
              radial-gradient(circle at 80% 80%, #065f46, transparent),
              #0f172a;
}

/* ===== CONTAINER ===== */
.container {
  padding:15px;
  max-width:480px;
  margin:auto;
  animation:fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

/* ===== INPUT ===== */
input {
  width:100%;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  font-size:16px;
  background:#1e293b;
  color:white;
  border:1px solid transparent;
  transition:0.2s;
}

input:focus {
  border:1px solid #22c55e;
  outline:none;
  box-shadow:0 0 10px rgba(34,197,94,0.4);
}

/* ===== BUTTON ===== */
button {
  width:100%;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
  font-size:16px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:bold;
  border:none;
  transition:0.2s;
}

button:active { transform:scale(0.97); }
button:hover { box-shadow:0 0 15px rgba(34,197,94,0.5); }

/* ===== CARD ===== */
.card {
  background: rgba(30,41,59,0.7);
  backdrop-filter: blur(10px);
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  border:1px solid rgba(255,255,255,0.05);
}

/* ===== SPLASH ===== */
#splashScreen {
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
  transition:opacity 0.6s;
}

#splashScreen.hide {opacity:0;}

.logo {
  font-size:42px;
  font-weight:bold;
  background:linear-gradient(90deg,#22c55e,#3b82f6,#22c55e);
  background-size:200% 200%;
  -webkit-background-clip:text;
  color:transparent;
  animation:gradientMove 3s infinite linear;
}

@keyframes gradientMove {
  0% {background-position:0%}
  100% {background-position:200%}
}

/* ===== LOADER ===== */
.loaderCircle {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-top:20px;
}

@keyframes spin {100%{transform:rotate(360deg);}}

/* ===== OVERLAY ===== */
#sendingOverlay {
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

/* ===== SUCCESS ===== */
#successPopup {
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popupBox {
  background:#22c55e;
  padding:20px;
  border-radius:15px;
  text-align:center;
  font-size:16px;
}

</style>
</head>

<body>

<div id="splashScreen">
  <div>
    <div class="logo">UZA</div>
    <div style="margin-top:10px;">Добро пожаловать</div>
    <div class="loaderCircle"></div>
  </div>
</div>

<div class="container">

<h2>📝 Портал подачи заявок</h2>

<input type="tel" id="inn" placeholder="Введите ИНН" maxlength="9">

<div id="client"></div>

<input type="tel" id="income" placeholder="Введите доход">

<label>📅 Выберите месяц</label>
<input type="month" id="month">

<button onclick="send()">🚀 Отправить</button>

</div>

<div id="sendingOverlay">
  <div>
    <div class="loaderCircle"></div>
    <div style="margin-top:10px;">Отправка...</div>
  </div>
</div>

<div id="successPopup">
  <div class="popupBox">
    🎉<br><br>Заявка отправлена!
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

let clientData = null;

/* splash */
window.addEventListener("load",()=>{
  setTimeout(()=>{splashScreen.classList.add("hide");},1500);
  setTimeout(()=>{splashScreen.style.display="none";},2200);
});

/* месяц */
document.addEventListener("DOMContentLoaded",()=>{
  const now=new Date();
  month.max = now.toISOString().slice(0,7);
});

/* поиск клиента */
inn.addEventListener("input",()=>{
  if(inn.value.length===9){
    client.innerHTML="🔍 Поиск...";
    
    fetch(API_URL+"?inn="+inn.value)
    .then(r=>r.json())
    .then(data=>{
      if(data.found){
        clientData=data;
        client.innerHTML=`
          <div class="card">
            👤 ${data.fio}<br>
            📍 ${data.address}<br>
            📞 ${data.phone}
          </div>`;
      } else {
        clientData=null;
        client.innerHTML=`<div class="card" style="background:#7f1d1d">❌ Не найдено</div>`;
      }
    })
    .catch(()=>{
      client.innerHTML=`<div class="card" style="background:#7f1d1d">Ошибка соединения</div>`;
    });
  }
});

/* отправка */
function send(){

  if(!clientData){
    client.innerHTML=`<div class="card" style="background:#7f1d1d">Введите корректный ИНН</div>`;
    return;
  }

  if(!income.value){
    client.innerHTML=`<div class="card" style="background:#7f1d1d">Введите доход</div>`;
    return;
  }

  sendingOverlay.style.display="flex";

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      inn:inn.value,
      income:income.value,
      month:month.value,
      fio:clientData.fio,
      address:clientData.address,
      phone:clientData.phone
    })
  })
  .then(()=>{
    sendingOverlay.style.display="none";
    successPopup.style.display="flex";

    setTimeout(()=>successPopup.style.display="none",2000);

    inn.value="";
    income.value="";
    client.innerHTML="";
    clientData=null;
  })
  .catch(()=>{
    sendingOverlay.style.display="none";
    client.innerHTML=`<div class="card" style="background:#7f1d1d">Ошибка отправки</div>`;
  });
}

</script>

</body>
</html>
