<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:Arial;
  color:#fff;
  background:#0f172a;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.logo {width:40px}

/* INPUT */
input {
  width:100%;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  background:#1e293b;
  color:#fff;
  border:none;
}

/* BUTTON */
button {
  width:100%;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  background:#22c55e;
  color:#fff;
  border:none;
}
button:disabled {background:#475569}

/* CARD */
.card {
  background:#1e293b;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

/* SEARCH */
.spinner {
  width:30px;
  height:30px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin {100%{transform:rotate(360deg);}}

/* SEND */
#sendingOverlay {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
}

.progressBox {
  width:80%;
  max-width:250px;
  text-align:center;
}

.progressBar {
  width:100%;
  height:8px;
  background:#334155;
  border-radius:10px;
}

#progressFill {
  height:100%;
  width:0%;
  background:#22c55e;
}

.container {padding:15px;}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <span id="title">📝 Портал подачи заявок</span>
  <img src="logo.png" class="logo">
</div>

<input id="inn" placeholder="Введите ИНН" maxlength="9">
<div id="searchStatus"></div>
<div id="client"></div>

<input id="income" placeholder="Введите доход">

<label>📅 Месяц</label>
<input type="month" id="month">

<button id="submitBtn" disabled onclick="send()">Отправить</button>

</div>

<!-- SEND -->
<div id="sendingOverlay">
  <div class="progressBox">
    <div id="progressText">0%</div>
    <div class="progressBar">
      <div id="progressFill"></div>
    </div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

let clientData=null;

/* месяц */
const now=new Date();
const prev=new Date(now.getFullYear(), now.getMonth()-1,1);
month.value=prev.toISOString().slice(0,7);

/* validate */
function validate(){
submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* цифры */
income.oninput=()=>{
income.value=income.value.replace(/\D/g,'');
validate();
};

/* поиск */
inn.oninput=()=>{
clientData=null;
validate();

if(inn.value.length===9){

searchStatus.innerHTML='<div class="spinner"></div>';

fetch(API_URL+"?inn="+inn.value)
.then(r=>r.json())
.then(d=>{
searchStatus.innerHTML="";
if(d.found){
clientData=d;
client.innerHTML=`<div class="card">${d.fio}<br>${d.address}<br>${d.phone}</div>`;
}
validate();
});
}
};

/* прогресс */
function startProgress(){
let p=0;
return setInterval(()=>{
p+=10;
if(p>90)p=90;
progressFill.style.width=p+"%";
progressText.innerText=p+"%";
},300);
}

/* send */
function send(){

sendingOverlay.style.display="flex";

let progress=startProgress();

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
inn:inn.value,
income:income.value,
month:month.value,
fio:clientData.fio
})
}).then(()=>{
clearInterval(progress);

progressFill.style.width="100%";
progressText.innerText="100%";

setTimeout(()=>{
sendingOverlay.style.display="none";
alert("Успешно");
},500);
});
}
</script>

</body>
</html>
