<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:-apple-system, Arial;
  color:#fff;
  background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent),
              radial-gradient(circle at 80% 80%, #065f46, transparent),
              #0f172a;
}

/* VERSION */
#appVersion {
  position:fixed;
  top:8px;
  right:12px;
  font-size:11px;
  opacity:0.6;
  background:#1e293b;
  padding:4px 8px;
  border-radius:8px;
}

/* SPLASH */
#splashScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}
.splash-logo {width:80px;margin-bottom:10px;}

.loader {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin {100%{transform:rotate(360deg);}}

/* HEADER */
.header {display:flex;justify-content:space-between;align-items:center;padding:15px;}
.logo-right {width:40px}

/* INPUT */
input {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  font-size:18px;
  background:#1e293b;
  color:white;
  border:none;
}

/* CARD */
.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn {from{opacity:0;transform:translateY(10px);}}

/* SEARCH */
.searchSpinner {
  width:28px;height:28px;
  border:3px solid #334155;
  border-top:3px solid #22c55e;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:auto;
}

/* BUTTON */
button {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
  font-size:18px;
  background:#22c55e;
  color:white;
  border:none;
}
button:disabled {background:#475569}

/* LANG */
.langSwitch {display:flex;background:#1e293b;border-radius:20px;width:120px;margin:10px;}
.langBtn {flex:1;text-align:center;padding:8px;cursor:pointer;}
.langBtn.active {background:#22c55e}

/* SEND OVERLAY */
#sendingOverlay {
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.progressCircle {font-size:30px;margin-bottom:15px;}
.progressLine {width:200px;height:8px;background:#334155;border-radius:10px;}
#progressFill {height:100%;width:0;background:#22c55e;}

.container {padding:15px;}
</style>
</head>

<body>

<div id="appVersion"></div>

<!-- SPLASH -->
<div id="splashScreen">
  <div style="text-align:center">
    <img src="logo.png" class="splash-logo">
    <h2 id="splashTitle"></h2>
    <div id="splashSub"></div>
    <div id="splashVersion"></div>
    <div class="loader"></div>
  </div>
</div>

<div class="container">

<div class="langSwitch">
  <div class="langBtn" data-lang="ru">RU</div>
  <div class="langBtn" data-lang="tj">TJ</div>
</div>

<div class="header">
  <span id="title"></span>
  <img src="logo.png" class="logo-right">
</div>

<input id="inn" inputmode="numeric" maxlength="9">
<div id="searchStatus"></div>
<div id="client"></div>

<input id="income" inputmode="numeric">

<label id="monthLabel"></label>
<input type="month" id="month">

<button id="submitBtn" onclick="send()" disabled></button>

</div>

<!-- SEND -->
<div id="sendingOverlay">
  <div>
    <div class="progressCircle" id="progressText">0%</div>
    <div class="progressLine"><div id="progressFill"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const APP_VERSION="v10.0";
appVersion.innerText=APP_VERSION;
splashVersion.innerText=APP_VERSION;

const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

let clientData=null;

/* month fix */
const now=new Date();
const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
month.value=prev.toISOString().slice(0,7);

/* validate */
function validate(){
submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* only numbers */
income.oninput=()=>{
income.value=income.value.replace(/\D/g,'');
validate();
};

/* search */
inn.oninput=()=>{
clientData=null;
validate();

if(inn.value.length===9){
searchStatus.innerHTML='<div class="searchSpinner"></div>';

fetch(API_URL+"?inn="+inn.value)
.then(r=>r.json())
.then(d=>{
searchStatus.innerHTML="";
if(d.found){
clientData=d;
client.innerHTML=`<div class="card">${d.fio}<br>${d.address}<br>${d.phone}</div>`;
}
validate();
});
}
};

/* progress animation */
function startProgress(){
let p=0;
return setInterval(()=>{
p+=10;
if(p>90)p=90;
progressFill.style.width=p+"%";
progressText.innerText=p+"%";
},300);
}

/* send */
function send(){

sendingOverlay.style.display="flex";

let progress=startProgress();

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
inn:inn.value,
income:income.value,
month:month.value,
fio:clientData.fio
})
}).then(()=>{
clearInterval(progress);

progressFill.style.width="100%";
progressText.innerText="100%";

setTimeout(()=>{
sendingOverlay.style.display="none";

confetti({particleCount:150,spread:90});

inn.value="";
income.value="";
client.innerHTML="";
clientData=null;
validate();
},500);
});
}

/* splash */
window.onload=()=>setTimeout(()=>splashScreen.style.display="none",1500);
</script>

</body>
</html>
