<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:-apple-system, Arial;
  color:#fff;
  background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent),
              radial-gradient(circle at 80% 80%, #065f46, transparent),
              #0f172a;
}

/* VERSION */
#appVersion {
  position:fixed;
  top:8px;
  right:12px;
  font-size:11px;
  opacity:0.6;
  background:#1e293b;
  padding:4px 8px;
  border-radius:8px;
}

/* UPDATE TOAST */
#updateToast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 15px;
  border-radius:10px;
  display:none;
  z-index:9999;
}

/* SPLASH */
#splashScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.loader {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {100%{transform:rotate(360deg);}}

/* INPUT */
input {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  font-size:18px;
  background:#1e293b;
  color:white;
  border:none;
}

/* BUTTON */
button {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
  font-size:18px;
  background:#22c55e;
  color:white;
  border:none;
}

button:disabled {background:#475569;}

/* CARD */
.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  animation:fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

/* SEARCH */
.searchBox {
  display:flex;
  justify-content:center;
  margin-top:10px;
}

.searchSpinner {
  width:28px;height:28px;
  border:3px solid #334155;
  border-top:3px solid #22c55e;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

/* LANG */
.langSwitch {
  display:flex;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  width:120px;
  margin:10px;
}

.langBtn {
  flex:1;
  text-align:center;
  padding:8px;
  cursor:pointer;
}

.langBtn.active {background:#22c55e;}

.container {padding:15px;}
</style>
</head>

<body>

<div id="appVersion"></div>
<div id="updateToast">🔄 Обновляем приложение...</div>

<div id="splashScreen">
  <div>
    <h2>Добро пожаловать</h2>
    <div id="splashVersion"></div>
    <div class="loader"></div>
  </div>
</div>

<div class="container">

<div class="langSwitch">
  <div class="langBtn active" data-lang="ru">RU</div>
  <div class="langBtn" data-lang="tj">TJ</div>
</div>

<input id="inn" inputmode="numeric" maxlength="9" placeholder="ИНН">
<div id="searchStatus"></div>
<div id="client"></div>

<input id="income" inputmode="numeric" placeholder="Доход">
<input type="month" id="month">

<button id="submitBtn" onclick="send()" disabled>Отправить</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* VERSION */
const APP_VERSION="v7.0";
const SERVER_VERSION="v7.1";

appVersion.innerText=APP_VERSION;
splashVersion.innerText=APP_VERSION;

/* AUTO UPDATE */
function checkUpdate(){
  const saved = localStorage.getItem("app_version");

  if(saved !== SERVER_VERSION){
    updateToast.style.display="block";
    localStorage.setItem("app_version", SERVER_VERSION);

    setTimeout(()=>location.reload(true),1500);
  }
}

window.onload=()=>{
  setTimeout(()=>splashScreen.style.display="none",1500);
  checkUpdate();
};

/* API */
const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

let clientData=null;

/* FIX BUTTON */
function validate(){
  submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* month fix */
const now=new Date();
const prev=new Date(now.getFullYear(), now.getMonth()-1,1);
month.value=prev.toISOString().slice(0,7);

/* only numbers */
income.oninput=()=>{
  income.value=income.value.replace(/\D/g,'');
  validate();
};

/* search */
inn.oninput=()=>{
  clientData=null;
  validate();

  if(inn.value.length===9){

    searchStatus.innerHTML='<div class="searchBox"><div class="searchSpinner"></div></div>';

    fetch(API_URL+"?inn="+inn.value)
    .then(r=>r.json())
    .then(d=>{
      if(d.found){
        clientData=d;

        client.innerHTML=`
        <div class="card">
        👤 ${d.fio}<br>
        📍 ${d.address || "-"}<br>
        📞 ${d.phone || "-"}
        </div>`;
      } else {
        searchStatus.innerHTML="❌ Не найдено";
      }

      validate();
    });
  }
};

/* month fix */
month.addEventListener("change", validate);

/* send */
function send(){
  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      inn:inn.value,
      income:income.value,
      month:month.value,
      fio:clientData.fio,
      employee_fio:clientData.employee_fio
    })
  }).then(()=>{
    confetti({particleCount:120,spread:70});
    alert("Успешно!");
  });
}

</script>

</body>
</html>
