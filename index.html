<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:-apple-system, Arial;
  color:#fff;
  background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent),
              radial-gradient(circle at 80% 80%, #065f46, transparent),
              #0f172a;
}

/* SPLASH */
#splashScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.splash-logo {width:80px;margin-bottom:10px;}

.loader {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {100%{transform:rotate(360deg);}}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}
.logo {width:40px}

/* INPUT */
input {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  font-size:18px;
  background:#1e293b;
  color:white;
  border:none;
}

/* SEARCH */
.searchSpinner {
  width:28px;height:28px;
  border:3px solid #334155;
  border-top:3px solid #22c55e;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:auto;
}

/* CARD */
.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

/* BUTTON */
button {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
  font-size:18px;
  background:#22c55e;
  color:white;
  border:none;
}
button:disabled {background:#475569}

/* PROGRESS */
.progressBox {height:6px;background:#1e293b;margin:10px;}
#progressBar {height:100%;width:0%;background:#22c55e}

/* LANG */
.langSwitch {
  display:flex;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  width:120px;
  margin:10px;
}
.langBtn {
  flex:1;
  text-align:center;
  padding:8px;
  cursor:pointer;
}
.langBtn.active {background:#22c55e}

.container {padding:15px;}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splashScreen">
  <div style="text-align:center">
    <img src="logo.png" class="splash-logo">
    <h2 id="splashTitle"></h2>
    <div id="splashSub"></div>
    <div class="loader"></div>
  </div>
</div>

<div class="container">

<div class="langSwitch">
  <div class="langBtn" data-lang="ru">RU</div>
  <div class="langBtn" data-lang="tj">TJ</div>
</div>

<div class="progressBox"><div id="progressBar"></div></div>

<div class="header">
  <span id="title"></span>
  <img src="logo.png" class="logo">
</div>

<input id="inn" inputmode="numeric" maxlength="9">
<div id="searchStatus"></div>
<div id="client"></div>

<input id="income" inputmode="numeric">

<label id="monthLabel"></label>
<input type="month" id="month">

<button id="submitBtn" onclick="send()" disabled></button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

const translations={
ru:{title:"📝 Портал подачи заявок",inn:"Введите ИНН",income:"Введите доход",month:"Выберите месяц",send:"🚀 Отправить",splash:"Добро пожаловать",sub:"в Портал подачи заявок"},
tj:{title:"📝 Портали дархостҳо",inn:"РМА-ро ворид кунед",income:"Даромадро ворид кунед",month:"Моҳро интихоб кунед",send:"🚀 Ирсол",splash:"Хуш омадед",sub:"ба портал"}
};

let clientData=null;

/* язык */
function setLang(l){
const t=translations[l];
title.innerText=t.title;
inn.placeholder=t.inn;
income.placeholder=t.income;
monthLabel.innerText="📅 "+t.month;
submitBtn.innerText=t.send;
splashTitle.innerText=t.splash;
splashSub.innerText=t.sub;
localStorage.setItem("lang",l);
}

const lang=localStorage.getItem("lang")||"ru";
setLang(lang);

document.querySelectorAll(".langBtn").forEach(btn=>{
if(btn.dataset.lang===lang)btn.classList.add("active");
btn.onclick=()=>{
document.querySelectorAll(".langBtn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
setLang(btn.dataset.lang);
};
});

/* splash */
window.onload=()=>setTimeout(()=>splashScreen.style.display="none",1500);

/* месяц */
const now=new Date();
const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
month.value=prev.toISOString().slice(0,7);

/* validate */
function validate(){
submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* цифры */
income.oninput=()=>{
income.value=income.value.replace(/\D/g,'');
validate();
};

/* поиск */
inn.oninput=()=>{
clientData=null;
validate();

if(inn.value.length===9){
searchStatus.innerHTML='<div class="searchSpinner"></div>';

fetch(API_URL+"?inn="+inn.value)
.then(r=>r.json())
.then(d=>{
searchStatus.innerHTML="";
if(d.found){
clientData=d;
client.innerHTML=`<div class="card">${d.fio}<br>${d.address}<br>${d.phone}</div>`;
}
validate();
});
}
};

/* отправка */
function send(){
fetch(API_URL,{
method:"POST",
body:JSON.stringify({
inn:inn.value,
income:income.value,
month:month.value,
fio:clientData.fio
})
}).then(()=>{
confetti({particleCount:150,spread:90});
alert("Успешно!");
});
}
</script>

</body>
</html>
