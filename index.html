<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e3a8a"/>
  <title>UA Consulting v1.0.5</title>

  <link rel="stylesheet" href="style.css?v=104">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <img src="logo.png" class="logo" alt="UA Consulting">
    <div class="title">Подача заявки</div>
  </div>

  <!-- FORM -->
  <div class="form">

    <!-- ИНН -->
    <input 
      id="inn"
      placeholder="ИНН (9 цифр)"
      type="tel"
      inputmode="numeric"
      autocomplete="off"
    />

    <!-- ФИО -->
    <div class="input-wrapper">
      <input id="fio" placeholder="ФИО" disabled />
      <span id="fioStatus" class="status hidden">
        ✔ Подтверждено
      </span>
    </div>

    <!-- Адрес -->
    <div class="input-wrapper">
      <input id="address" placeholder="Адрес" disabled />
      <span id="addressStatus" class="status hidden">✔</span>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader hidden"></div>

    <!-- Доход -->
    <div class="input-wrapper">
      <input 
        id="income"
        placeholder="Выручка"
        type="tel"
        inputmode="numeric"
        autocomplete="off"
      />
      <span id="incomeCheck" class="status hidden">✔</span>
    </div>

    <!-- Месяц -->
    <select id="month">
      <option value="">Выберите месяц</option>
      <option>Январь</option>
      <option>Февраль</option>
      <option>Март</option>
      <option>Апрель</option>
      <option>Май</option>
      <option>Июнь</option>
      <option>Июль</option>
      <option>Август</option>
      <option>Сентябрь</option>
      <option>Октябрь</option>
      <option>Ноябрь</option>
      <option>Декабрь</option>
    </select>

  </div>

  <!-- BUTTON -->
  <button id="sendBtn" disabled class="main-btn">
    Отправить
  </button>

  <!-- VERSION -->
  <div class="version">
    Версия: 1.0.5
  </div>

</div>

<script src="main.js?v=104"></script>

</body>
</html>
