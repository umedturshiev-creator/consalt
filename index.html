<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:-apple-system, Arial;
  color:#fff;
  background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent),
              radial-gradient(circle at 80% 80%, #065f46, transparent),
              #0f172a;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.logo {width:40px}

/* INPUT */
input {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  font-size:18px;
  background:#1e293b;
  color:white;
  border:none;
}

/* SEARCH */
.searchSpinner {
  width:28px;height:28px;
  border:3px solid #334155;
  border-top:3px solid #22c55e;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:auto;
}
@keyframes spin {100%{transform:rotate(360deg);}}

/* CARD */
.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

/* BUTTON */
button {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
  font-size:18px;
  background:#22c55e;
  color:white;
  border:none;
}
button:disabled {background:#475569}

.container {padding:15px;}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div>
    <span>📝 Портал подачи заявок</span><br>
    <small style="color:#94a3b8;font-size:12px;">v1.0.2</small>
  </div>
  <img src="logo.png" class="logo">
</div>

<input id="inn" placeholder="Введите ИНН" inputmode="numeric" maxlength="9">
<div id="searchStatus"></div>
<div id="client"></div>

<input id="income" placeholder="Введите доход" inputmode="numeric">

<label>📅 Выберите месяц</label>
<input type="month" id="month">

<button id="submitBtn" onclick="send()" disabled>🚀 Отправить</button>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

let clientData=null;

/* месяц (правильный) */
const now = new Date();
const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
const year = prev.getFullYear();
const monthNum = String(prev.getMonth() + 1).padStart(2, '0');
month.value = `${year}-${monthNum}`;

/* validate */
function validate(){
submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* только цифры */
income.oninput=()=>{
income.value=income.value.replace(/\D/g,'');
validate();
};

/* поиск ИНН */
inn.oninput=()=>{
clientData=null;
validate();

if(inn.value.length===9){

searchStatus.innerHTML='<div class="searchSpinner"></div>';

fetch(API_URL+"?inn="+inn.value)
.then(r=>r.json())
.then(d=>{
console.log("API:", d);

searchStatus.innerHTML="";

/* универсальный разбор */
let data = d.data || d;

let fio = data.fio || data.name || "";
let address = data.address || data.addr || "";
let phone = data.phone || data.tel || "";

if(d.found){

clientData = {
  fio: fio,
  address: address,
  phone: phone
};

searchStatus.innerHTML = `
<div style="color:#22c55e;font-weight:bold;">
  ✅ ИНН найден
</div>`;

client.innerHTML = `
<div class="card">
  👤 <b>${fio || "—"}</b><br>
  📍 ${address || "—"}<br>
  📞 ${phone || "—"}
</div>`;

}else{

clientData=null;

searchStatus.innerHTML = `
<div style="color:#ef4444;font-weight:bold;">
  ❌ ИНН не найден
</div>`;

client.innerHTML="";
}

validate();
})
.catch(()=>{
searchStatus.innerHTML = `
<div style="color:#ef4444;">
  ⚠️ Ошибка подключения
</div>`;
});

}
};

/* отправка */
function send(){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
inn:inn.value,
income:income.value,
month:month.value,
fio:clientData.fio
})
})
.then(()=>{
alert("Отправлено ✅");

inn.value="";
income.value="";
client.innerHTML="";
clientData=null;
validate();
});
}
</script>

</body>
</html>
