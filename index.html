<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:-apple-system, Arial;
  color:#fff;
  background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent),
              radial-gradient(circle at 80% 80%, #065f46, transparent),
              #0f172a;
}

/* VERSION */
#appVersion {
  position:fixed;
  top:8px;
  right:12px;
  font-size:11px;
  opacity:0.6;
  background:#1e293b;
  padding:4px 8px;
  border-radius:8px;
}

/* UPDATE */
#updateToast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 15px;
  border-radius:10px;
  display:none;
  z-index:9999;
}

/* SPLASH */
#splashScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.splash-content{text-align:center;}
.splash-logo{width:80px;margin-bottom:10px;}

.loader {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {100%{transform:rotate(360deg);}}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.logo-right {width:40px}

/* INPUT */
input {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  font-size:18px;
  background:#1e293b;
  color:white;
  border:none;
}

/* SUCCESS INPUT */
.input-success {border:1px solid #22c55e}

/* SEARCH */
.searchBox {
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:10px;
}

.searchSpinner {
  width:28px;height:28px;
  border:3px solid #334155;
  border-top:3px solid #22c55e;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

/* CARD */
.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  animation:fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

/* BUTTON */
button {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
  font-size:18px;
  background:#22c55e;
  color:white;
  border:none;
}

button:disabled {background:#475569}

/* PROGRESS */
.progressBox {height:6px;background:#1e293b;margin:10px;}
#progressBar {height:100%;width:0%;background:#22c55e}

/* LANG */
.langSwitch {
  display:flex;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  width:120px;
  margin:10px;
}

.langBtn {
  flex:1;
  text-align:center;
  padding:8px;
  cursor:pointer;
}

.langBtn.active {background:#22c55e}

/* SEND OVERLAY */
#sendingOverlay {
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.bigSpinner {
  width:60px;height:60px;
  border:5px solid #334155;
  border-top:5px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

#successPopup {
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.successBox {
  background:#22c55e;
  padding:20px;
  border-radius:15px;
  font-size:18px;
}

.container {padding:15px;}
</style>
</head>

<body>

<div id="appVersion"></div>
<div id="updateToast">🔄 Обновление...</div>

<!-- SPLASH -->
<div id="splashScreen">
  <div class="splash-content">
    <img src="logo.png" class="splash-logo">
    <h2 id="splashTitle"></h2>
    <div id="splashSub"></div>
    <div id="splashVersion"></div>
    <div class="loader"></div>
  </div>
</div>

<div class="container">

<div class="langSwitch">
  <div class="langBtn" data-lang="ru">RU</div>
  <div class="langBtn" data-lang="tj">TJ</div>
</div>

<div class="progressBox"><div id="progressBar"></div></div>

<div class="header">
  <span id="title"></span>
  <img src="logo.png" class="logo-right">
</div>

<input id="inn" inputmode="numeric" maxlength="9">
<div id="searchStatus"></div>
<div id="client"></div>

<input id="income" inputmode="numeric">

<label id="monthLabel"></label>
<input type="month" id="month">

<button id="submitBtn" onclick="send()" disabled></button>

</div>

<!-- SEND UI -->
<div id="sendingOverlay"><div class="bigSpinner"></div></div>
<div id="successPopup"><div class="successBox">✅ Готово</div></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const APP_VERSION="v9.0";
const SERVER_VERSION="v9.1";

appVersion.innerText=APP_VERSION;
splashVersion.innerText=APP_VERSION;

/* AUTO UPDATE */
if(localStorage.getItem("ver")!==SERVER_VERSION){
updateToast.style.display="block";
localStorage.setItem("ver",SERVER_VERSION);
setTimeout(()=>location.reload(),1500);
}

const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

const translations={
ru:{title:"📝 Портал подачи заявок",inn:"Введите ИНН",income:"Введите доход",month:"Выберите месяц",send:"🚀 Отправить",splash:"Добро пожаловать",sub:"в Портал подачи заявок"},
tj:{title:"📝 Портали дархостҳо",inn:"РМА-ро ворид кунед",income:"Даромадро ворид кунед",month:"Моҳро интихоб кунед",send:"🚀 Ирсол",splash:"Хуш омадед",sub:"ба портал"}
};

let clientData=null;

/* LANG */
function setLang(l){
const t=translations[l];
title.innerText=t.title;
inn.placeholder=t.inn;
income.placeholder=t.income;
monthLabel.innerText="📅 "+t.month;
submitBtn.innerText=t.send;
splashTitle.innerText=t.splash;
splashSub.innerText=t.sub;
localStorage.setItem("lang",l);
}

const lang=localStorage.getItem("lang")||"ru";
setLang(lang);

document.querySelectorAll(".langBtn").forEach(btn=>{
if(btn.dataset.lang===lang)btn.classList.add("active");
btn.onclick=()=>{
document.querySelectorAll(".langBtn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
setLang(btn.dataset.lang);
};
});

/* SPLASH */
window.onload=()=>setTimeout(()=>splashScreen.style.display="none",1500);

/* MONTH */
document.addEventListener("DOMContentLoaded",()=>{
const now=new Date();
const prev=new Date(now.getFullYear(), now.getMonth()-1,1);
month.value=prev.getFullYear()+"-"+String(prev.getMonth()+1).padStart(2,'0');
});

/* ONLY NUMBERS */
income.oninput=()=>{
income.value=income.value.replace(/\D/g,'');
validate();
};

/* PROGRESS */
function updateProgress(){
let p=0;
if(inn.value.length===9)p+=33;
if(income.value)p+=33;
if(month.value)p+=34;
progressBar.style.width=p+"%";
}

/* VALIDATE */
function validate(){
submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* SEARCH */
inn.oninput=()=>{
clientData=null;
updateProgress();
validate();

if(inn.value.length===9){

searchStatus.innerHTML='<div class="searchBox"><div class="searchSpinner"></div></div>';
client.innerHTML="";

fetch(API_URL+"?inn="+inn.value)
.then(r=>r.json())
.then(d=>{
searchStatus.innerHTML="";

if(d.found){
clientData=d;
inn.classList.add("input-success");

client.innerHTML=`
<div class="card">
👤 ${d.fio}<br>
📍 ${d.address || "-"}<br>
📞 ${d.phone || "-"}
</div>`;
}else{
searchStatus.innerHTML="❌ Не найдено";
}

validate();
});
}
};

/* SEND */
function send(){
sendingOverlay.style.display="flex";

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
inn:inn.value,
income:income.value,
month:month.value,
fio:clientData.fio,
employee_fio:clientData.employee_fio
})
}).then(()=>{
sendingOverlay.style.display="none";

confetti({particleCount:150,spread:90});

successPopup.style.display="flex";
setTimeout(()=>successPopup.style.display="none",2000);

inn.value="";
income.value="";
client.innerHTML="";
clientData=null;
validate();
});
}

</script>

</body>
</html>
