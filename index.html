<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Форма подачи заявки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="toastContainer" class="toast-container"></div>

  <div class="card">
    <h1>Форма подачи заявки</h1>

    <input id="inn" placeholder="ИНН (9 цифр)" />

    <div class="fio-wrapper">
      <input id="fio" placeholder="ФИО (заполняется автоматически)" disabled />
      <span id="checkIcon" class="check hidden">
        ✔
        <span class="tooltip">Данные подтверждены</span>
      </span>
    </div>

    <div id="loader" class="loader hidden"></div>

    <div class="income-wrapper">
      <input id="income" placeholder="Выручка за период" />
      <span id="incomeCheck" class="check hidden">✔</span>
    </div>

    <select id="month">
      <option value="">Выберите месяц</option>
      <option>Январь</option><option>Февраль</option><option>Март</option>
      <option>Апрель</option><option>Май</option><option>Июнь</option>
      <option>Июль</option><option>Август</option><option>Сентябрь</option>
      <option>Октябрь</option><option>Ноябрь</option><option>Декабрь</option>
    </select>

    <button id="sendBtn" disabled>Отправить</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
