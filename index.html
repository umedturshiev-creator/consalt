<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#1e3a8a"/>
  <title>UA Consulting v2.1</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <img src="logo.png" class="logo">
    <div class="title">Подача заявки</div>
    <div class="version-top">v2.1</div>
  </div>

  <!-- FORM -->
  <div class="form">

    <!-- ИНН -->
    <input id="inn"
           placeholder="ИНН (9 цифр)"
           type="tel"
           inputmode="numeric"
           autocomplete="off"/>

    <div id="innError" class="error-message hidden">
      ИНН не найден
    </div>

    <!-- ДОХОД -->
    <input id="income"
           placeholder="Выручка"
           type="tel"
           inputmode="numeric"/>

    <!-- МЕСЯЦ -->
    <select id="month">
      <option value="">Выберите месяц</option>
      <option>Январь</option>
      <option>Февраль</option>
      <option>Март</option>
      <option>Апрель</option>
      <option>Май</option>
      <option>Июнь</option>
      <option>Июль</option>
      <option>Август</option>
      <option>Сентябрь</option>
      <option>Октябрь</option>
      <option>Ноябрь</option>
      <option>Декабрь</option>
    </select>

    <!-- КНОПКА -->
    <button id="sendBtn" class="main-btn">
      Отправить
    </button>

  </div>

</div>

<!-- КНОПКА УСТАНОВКИ -->
<button id="installBtn" class="install-btn hidden">
  Установить приложение
</button>

<script src="main.js?v=21"></script>

<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.remove('hidden');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').classList.add('hidden');
});

// Регистрация Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
