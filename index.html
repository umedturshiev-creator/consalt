<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:-apple-system, Arial;
  color:#fff;
  background:#0f172a;
}

/* VERSION */
#appVersion {
  position:fixed;
  top:8px;
  right:12px;
  font-size:11px;
  opacity:0.6;
  background:#1e293b;
  padding:4px 8px;
  border-radius:8px;
}

/* SPLASH */
#splashScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.splash-content{text-align:center;}
.splash-logo{width:80px;margin-bottom:10px;}

.loader {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {100%{transform:rotate(360deg);}}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.logo-right {width:40px}

/* INPUT */
input {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  font-size:18px;
  background:#1e293b;
  color:white;
  border:none;
}

/* SEARCH */
.searchLoader {
  margin-top:10px;
  text-align:center;
  opacity:0.7;
}

/* CARD */
.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

/* BUTTON */
button {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
  font-size:18px;
  background:#22c55e;
  color:white;
  border:none;
}

button:disabled {background:#475569;}

/* PROGRESS */
.progressBox {
  height:6px;
  background:#1e293b;
}

#progressBar {
  height:100%;
  width:0%;
  background:#22c55e;
}

.container{padding:15px;}
</style>
</head>

<body>

<div id="appVersion"></div>

<div id="splashScreen">
  <div class="splash-content">
    <img src="logo.png" class="splash-logo">
    <h2 id="splashTitle"></h2>
    <div id="splashSub"></div>
    <div id="splashVersion"></div>
    <div class="loader"></div>
  </div>
</div>

<div class="container">

<select id="langSwitcher">
  <option value="ru">Русский</option>
  <option value="tj">Тоҷикӣ</option>
</select>

<div class="progressBox"><div id="progressBar"></div></div>

<div class="header">
  <span id="title"></span>
  <img src="logo.png" class="logo-right">
</div>

<input id="inn" inputmode="numeric" maxlength="9">
<div id="searchStatus" class="searchLoader"></div>
<div id="client"></div>

<input id="income" inputmode="numeric">

<label id="monthLabel"></label>
<input type="month" id="month">

<button id="submitBtn" onclick="send()" disabled></button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const APP_VERSION="v5.0";
appVersion.innerText=APP_VERSION;
splashVersion.innerText=APP_VERSION;

const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

const translations={
ru:{
title:"📝 Портал подачи заявок",
inn:"Введите ИНН",
income:"Введите доход",
month:"Выберите месяц",
send:"🚀 Отправить",
splash:"Добро пожаловать",
sub:"в Портал подачи заявок"
},
tj:{
title:"📝 Портали дархостҳо",
inn:"РМА-ро ворид кунед",
income:"Даромадро ворид кунед",
month:"Моҳро интихоб кунед",
send:"🚀 Ирсол",
splash:"Хуш омадед",
sub:"ба портал"
}
};

let clientData=null;

/* язык */
function setLang(l){
const t=translations[l];
title.innerText=t.title;
inn.placeholder=t.inn;
income.placeholder=t.income;
monthLabel.innerText="📅 "+t.month;
submitBtn.innerText=t.send;
splashTitle.innerText=t.splash;
splashSub.innerText=t.sub;
localStorage.setItem("lang",l);
}

const lang=localStorage.getItem("lang")||"ru";
langSwitcher.value=lang;
setLang(lang);
langSwitcher.onchange=()=>setLang(langSwitcher.value);

/* splash */
window.onload=()=>setTimeout(()=>splashScreen.style.display="none",1500);

/* месяц правильный */
document.addEventListener("DOMContentLoaded",()=>{
const now=new Date();
const prev=new Date(now.getFullYear(), now.getMonth()-1, 1);

const y=prev.getFullYear();
const m=String(prev.getMonth()+1).padStart(2,'0');

month.value = y+"-"+m;
});

/* только цифры */
income.oninput=()=>income.value=income.value.replace(/\D/g,'');

/* progress */
function updateProgress(){
let p=0;
if(inn.value.length===9)p+=33;
if(income.value)p+=33;
if(month.value)p+=34;
progressBar.style.width=p+"%";
}

/* validate */
function validate(){
submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* поиск */
inn.oninput=()=>{
updateProgress();validate();

if(inn.value.length===9){
searchStatus.innerHTML="🔍 Поиск...";
client.innerHTML="";

fetch(API_URL+"?inn="+inn.value)
.then(r=>r.json())
.then(d=>{
if(d.found){
clientData=d;

client.innerHTML=`
<div class="card">
👤 ${d.fio}<br>
📍 ${d.address || "-"}<br>
📞 ${d.phone || "-"}
</div>`;

searchStatus.innerHTML="✅ Найдено";
}else{
searchStatus.innerHTML="❌ Не найдено";
}
validate();
});
}
};

/* отправка */
function send(){
fetch(API_URL,{
method:"POST",
body:JSON.stringify({
inn:inn.value,
income:income.value,
month:month.value,
fio:clientData.fio,
employee_fio:clientData.employee_fio
})
}).then(()=>{
confetti({particleCount:120,spread:70});
alert("Успешно!");
});
}
</script>

</body>
</html>
