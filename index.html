<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#1e3a8a"/>
  <title>UA Consulting v3.2</title>

  <link rel="stylesheet" href="style.css?v=31">
</head>
<body>

<div class="app">

  <div class="header">
    <img src="logo.png" class="logo">
    <div class="title">Подача заявки</div>
    <div class="version-top">v3.2</div>
  </div>

  <!-- SKELETON OVERLAY -->
  <div id="skeletonOverlay" class="skeleton-overlay hidden">
    <div class="skeleton-card">
      <div class="skeleton-field"></div>
      <div class="skeleton-field short"></div>
    </div>
  </div>

  <div class="form">

    <input id="inn"
           placeholder="Введите ИНН (9 цифр)"
           type="tel"
           inputmode="numeric"
           autocomplete="off"/>

    <div id="innError" class="error-message hidden">
      ИНН не найден
    </div>

    <div class="input-wrapper">
      <input id="fio" placeholder="ФИО" disabled/>
      <span id="fioStatus" class="status hidden">✔</span>
    </div>

    <div class="input-wrapper">
      <input id="address" placeholder="Адрес" disabled/>
      <span id="addressStatus" class="status hidden">✔</span>
    </div>

    <div class="input-wrapper">
      <input id="income"
             placeholder="Выручка"
             type="tel"
             inputmode="numeric"/>
      <span id="incomeCheck" class="status hidden">✔</span>
    </div>

    <select id="month">
      <option value="">Выберите месяц</option>
      <option>Январь</option>
      <option>Февраль</option>
      <option>Март</option>
      <option>Апрель</option>
      <option>Май</option>
      <option>Июнь</option>
      <option>Июль</option>
      <option>Август</option>
      <option>Сентябрь</option>
      <option>Октябрь</option>
      <option>Ноябрь</option>
      <option>Декабрь</option>
    </select>

    <button id="sendBtn" class="main-btn">
      Отправить
    </button>

  </div>

</div>

<script src="main.js?v=31"></script>
</body>
</html>
