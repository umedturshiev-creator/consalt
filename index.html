<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#1e3a8a"/>
  <title>UA Consulting v3.5</title>

  <link rel="stylesheet" href="style.css?v=35">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <img src="logo.png" class="logo" alt="UA Consulting">
    <div class="title">Подача заявки</div>
    <div class="version-top">v3.5</div>
  </div>

  <!-- SKELETON -->
  <div id="skeletonOverlay" class="skeleton-overlay hidden">
    <div class="skeleton-card">
      <div id="skeletonText" class="skeleton-title"></div>

      <div class="skeleton-field"></div>
      <div class="skeleton-field short"></div>

      <div class="skeleton-loader"></div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form">

    <!-- ИНН -->
    <input id="inn"
           placeholder="Введите ИНН (9 цифр)"
           type="tel"
           inputmode="numeric"
           autocomplete="off"/>

    <!-- Ошибка -->
    <div id="innError" class="error-message">
      ИНН не найден
    </div>

    <!-- ФИО -->
    <div class="input-wrapper">
      <input id="fio" placeholder="ФИО" disabled/>
      <span id="fioStatus" class="status">✔</span>
    </div>

    <!-- Адрес -->
    <div class="input-wrapper">
      <input id="address" placeholder="Адрес" disabled/>
      <span id="addressStatus" class="status">✔</span>
    </div>

    <!-- Доход -->
    <div class="input-wrapper">
      <input id="income"
             placeholder="Выручка"
             type="tel"
             inputmode="numeric"/>
      <span id="incomeCheck" class="status">✔</span>
    </div>

    <!-- Месяц -->
    <select id="month">
      <option value="">Выберите месяц</option>
      <option>Январь</option>
      <option>Февраль</option>
      <option>Март</option>
      <option>Апрель</option>
      <option>Май</option>
      <option>Июнь</option>
      <option>Июль</option>
      <option>Август</option>
      <option>Сентябрь</option>
      <option>Октябрь</option>
      <option>Ноябрь</option>
      <option>Декабрь</option>
    </select>

    <!-- КНОПКА -->
    <button id="sendBtn" type="button" class="main-btn">
      Отправить
    </button>

  </div>

</div>

<script src="main.js?v=35"></script>

</body>
</html>
