<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:Arial;
  color:#fff;
  background: radial-gradient(circle at 20% 20%, #1e3a8a, transparent),
              radial-gradient(circle at 80% 80%, #065f46, transparent),
              #0f172a;
}

.container {
  padding:15px;
  max-width:480px;
  margin:auto;
  animation:fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

input {
  width:100%;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  font-size:16px;
  background:#1e293b;
  color:white;
  border:1px solid transparent;
}

input:focus {
  border:1px solid #22c55e;
  outline:none;
  box-shadow:0 0 10px rgba(34,197,94,0.4);
}

button {
  width:100%;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
  font-size:16px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:bold;
  border:none;
}

.card {
  background: rgba(30,41,59,0.7);
  backdrop-filter: blur(10px);
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

#sendingOverlay, #successPopup {
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#sendingOverlay {background:rgba(0,0,0,0.85);}
#successPopup {background:rgba(0,0,0,0.7);}

.popupBox {
  background:#22c55e;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.loader {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {100%{transform:rotate(360deg);}}

</style>
</head>

<body>

<div class="container">

<h2>📝 Портал подачи заявок</h2>

<input type="tel" id="inn" placeholder="Введите ИНН" maxlength="9">

<div id="client"></div>

<input type="tel" id="income" placeholder="Введите доход">

<label>📅 Выберите месяц</label>
<input type="month" id="month">

<button onclick="send()">🚀 Отправить</button>

</div>

<div id="sendingOverlay">
  <div>
    <div class="loader"></div>
    <div style="margin-top:10px;">Отправка...</div>
  </div>
</div>

<div id="successPopup">
  <div class="popupBox">🎉 Заявка отправлена!</div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

let clientData = null;

/* месяц */
document.addEventListener("DOMContentLoaded",()=>{
  const now = new Date();

  // максимум — текущий месяц
  month.max = now.toISOString().slice(0,7);

  // 👇 прошлый месяц
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);

  const year = prev.getFullYear();
  const monthValue = String(prev.getMonth() + 1).padStart(2, '0');

  // 👇 устанавливаем значение
  month.value = year + "-" + monthValue;
});

/* поиск клиента */
inn.addEventListener("input",()=>{
  if(inn.value.length===9){
    client.innerHTML="🔍 Поиск...";
    
    fetch(API_URL+"?inn="+inn.value)
    .then(r=>r.json())
    .then(data=>{
      console.log(data); // 👈 для проверки сотрудников

      if(data.found){
        clientData=data;

        client.innerHTML=`
          <div class="card">
            👤 ${data.fio}<br>
            📍 ${data.address}<br>
            📞 ${data.phone}
          </div>`;
      } else {
        clientData=null;
        client.innerHTML=`<div class="card" style="background:#7f1d1d">❌ Не найдено</div>`;
      }
    })
    .catch(()=>{
      client.innerHTML=`<div class="card" style="background:#7f1d1d">Ошибка соединения</div>`;
    });
  }
});

/* отправка */
function send(){

  if(!clientData){
    client.innerHTML=`<div class="card" style="background:#7f1d1d">Введите корректный ИНН</div>`;
    return;
  }

  if(!income.value){
    client.innerHTML=`<div class="card" style="background:#7f1d1d">Введите доход</div>`;
    return;
  }

  sendingOverlay.style.display="flex";

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({

      inn:inn.value,
      income:income.value,
      month:month.value,

      fio:clientData.fio,
      address:clientData.address,
      phone:clientData.phone,

      // 🔥 ВОТ ОНИ — СОТРУДНИКИ
      employee_fio: clientData.employee_fio,
      employee_inn: clientData.employee_inn,
      employee_sin: clientData.employee_sin,
      employee_salary: clientData.employee_salary,
      employee_date: clientData.employee_date

    })
  })
  .then(()=>{
    sendingOverlay.style.display="none";
    successPopup.style.display="flex";

    setTimeout(()=>successPopup.style.display="none",2000);

    inn.value="";
    income.value="";
    client.innerHTML="";
    clientData=null;
  })
  .catch(()=>{
    sendingOverlay.style.display="none";
    client.innerHTML=`<div class="card" style="background:#7f1d1d">Ошибка отправки</div>`;
  });
}

</script>

</body>
</html>
