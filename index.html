<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>UZA App</title>

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, Arial;
  color:#fff;
  background:#0f172a;
}

/* VERSION */
#appVersion {
  position:fixed;
  top:8px;
  right:12px;
  font-size:11px;
  opacity:0.6;
  background:rgba(30,41,59,0.6);
  padding:4px 8px;
  border-radius:8px;
}

/* SPLASH */
#splashScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.loader {
  width:40px;height:40px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {100%{transform:rotate(360deg);}}

/* INPUT */
input {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  font-size:18px;
  background:#1e293b;
  color:white;
  border:none;
}

/* SEARCH LOADER */
.searchLoader {
  text-align:center;
  margin-top:10px;
  font-size:14px;
  opacity:0.7;
}

/* CARD */
.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

/* BUTTON */
button {
  width:100%;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
  font-size:18px;
  background:#22c55e;
  color:white;
  border:none;
}

button:disabled {
  background:#475569;
}

/* PROGRESS */
.progressBox {
  height:6px;
  background:#1e293b;
  border-radius:10px;
}

#progressBar {
  height:100%;
  width:0%;
  background:#22c55e;
}

/* MOBILE */
@media (max-width:480px){
  body {font-size:16px;}
}
</style>
</head>

<body>

<div id="appVersion"></div>

<div id="splashScreen">
  <div>
    <h2>Добро пожаловать</h2>
    <div id="splashVersion"></div>
    <div class="loader"></div>
  </div>
</div>

<div class="container">

<div class="progressBox">
  <div id="progressBar"></div>
</div>

<input id="inn" inputmode="numeric" pattern="[0-9]*" maxlength="9" placeholder="ИНН">
<div id="searchStatus"></div>
<div id="client"></div>

<input id="income" inputmode="numeric" placeholder="Доход">

<input type="month" id="month">

<button id="submitBtn" disabled onclick="send()">Отправить</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const APP_VERSION="v4.0";
appVersion.innerText=APP_VERSION;
splashVersion.innerText=APP_VERSION;

const API_URL="https://script.google.com/macros/s/AKfycbyajQuG9u4H-O78Ox0yHeMsXXqb9cfMNgS5Ow3q0AMcP1lifn0fwxR1_rTdMMyNN91l/exec";

let clientData=null;

/* splash */
window.onload=()=>setTimeout(()=>splashScreen.style.display="none",1500);

/* month */
const now=new Date();
const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
month.value=prev.toISOString().slice(0,7);

/* только цифры */
income.addEventListener("input",()=>{
  income.value = income.value.replace(/\D/g,'');
});

/* progress */
function updateProgress(){
let p=0;
if(inn.value.length===9)p+=33;
if(income.value)p+=33;
if(month.value)p+=34;
progressBar.style.width=p+"%";
}

/* validate */
function validate(){
submitBtn.disabled=!(inn.value.length===9 && income.value && month.value && clientData);
}

/* поиск с анимацией */
inn.oninput=()=>{
updateProgress(); validate();

if(inn.value.length===9){

searchStatus.innerHTML="🔍 Поиск...";
client.innerHTML="";

fetch(API_URL+"?inn="+inn.value)
.then(r=>r.json())
.then(d=>{
  if(d.found){
    clientData=d;

    client.innerHTML=`
      <div class="card">
        👤 ${d.fio}<br>
        📍 ${d.address || "-"}<br>
        📞 ${d.phone || "-"}
      </div>`;
    
    searchStatus.innerHTML="✅ Найдено";
  }else{
    searchStatus.innerHTML="❌ Не найдено";
  }
  validate();
});
}
};

/* отправка */
function send(){
fetch(API_URL,{
method:"POST",
body:JSON.stringify({
inn:inn.value,
income:income.value,
month:month.value,
fio:clientData.fio,
employee_fio:clientData.employee_fio
})
}).then(()=>{
confetti({particleCount:120,spread:70});
alert("Успешно!");
});
}

</script>

</body>
</html>
