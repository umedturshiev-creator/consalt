<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a"/>
  <title>UA Consulting</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="header">
    <img src="logo.png" class="logo">
    <div class="title">Подача заявки</div>
  </div>

  <div class="form">

    <input id="inn" placeholder="ИНН (9 цифр)" type="tel" inputmode="numeric"/>

    <div class="input-wrapper">
      <input id="fio" placeholder="ФИО" disabled />
      <span id="fioStatus" class="status hidden">✔ Подтверждено</span>
    </div>

    <div class="input-wrapper">
      <input id="address" placeholder="Адрес" disabled />
      <span id="addressStatus" class="status hidden">✔</span>
    </div>

    <div id="loader" class="loader hidden"></div>

    <div class="input-wrapper">
      <input id="income" placeholder="Выручка" type="tel" inputmode="numeric"/>
      <span id="incomeCheck" class="status hidden">✔</span>
    </div>

    <select id="month">
      <option value="">Выберите месяц</option>
      <option>Январь</option>
      <option>Февраль</option>
      <option>Март</option>
      <option>Апрель</option>
      <option>Май</option>
      <option>Июнь</option>
      <option>Июль</option>
      <option>Август</option>
      <option>Сентябрь</option>
      <option>Октябрь</option>
      <option>Ноябрь</option>
      <option>Декабрь</option>
    </select>

  </div>

  <button id="sendBtn" disabled class="main-btn">
    Отправить
  </button>

</div>

<script src="main.js"></script>

</body>
</html>
