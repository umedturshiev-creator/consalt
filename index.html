<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UA Consulting — Подача заявки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="toastContainer" class="toast-container"></div>

  <div class="card">

    <img src="logo.png" class="logo" alt="UA Consulting">

    <h1>Форма подачи заявки</h1>

    <input id="inn" placeholder="ИНН (9 цифр)" />

    <!-- ФИО -->
    <div class="input-wrapper">
      <input id="fio" placeholder="ФИО" disabled />
      <span id="fioStatus" class="status hidden">
        ✔ <span class="status-text">Данные подтверждены</span>
      </span>
    </div>

    <!-- Адрес -->
    <div class="input-wrapper">
      <input id="address" placeholder="Адрес" disabled />
      <span id="addressStatus" class="status hidden">✔</span>
    </div>

    <div id="loader" class="loader hidden"></div>

    <!-- Доход -->
    <div class="income-wrapper">
      <input id="income" placeholder="Выручка за период" />
      <span id="incomeCheck" class="check hidden">✔</span>
    </div>

    <!-- Месяц -->
    <select id="month">
      <option value="">Выберите месяц</option>
      <option>Январь</option>
      <option>Февраль</option>
      <option>Март</option>
      <option>Апрель</option>
      <option>Май</option>
      <option>Июнь</option>
      <option>Июль</option>
      <option>Август</option>
      <option>Сентябрь</option>
      <option>Октябрь</option>
      <option>Ноябрь</option>
      <option>Декабрь</option>
    </select>

    <button id="sendBtn" disabled>Отправить</button>

  </div>

  <script src="main.js"></script>
</body>
</html>
